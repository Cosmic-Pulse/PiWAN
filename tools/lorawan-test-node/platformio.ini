; Sends a few LoRaWAN uplinks so a gateway's receive path can be tested.
; Heltec WiFi LoRa 32 V2 (ESP32 + SX1276), US915 sub-band 2.
[env:heltec_v2]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V2
framework = arduino
monitor_speed = 115200
lib_deps = mcci-catena/MCCI LoRaWAN LMIC library@4.1.1
build_flags =
    -D ARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS
    -D CFG_us915=1
    -D CFG_sx1276_radio=1
    -D LMIC_LORAWAN_SPEC_VERSION=LMIC_LORAWAN_SPEC_VERSION_1_0_3
    -D DISABLE_PING
    -D DISABLE_BEACONS
    -D hal_init=LMICHAL_init  ; Arduino-ESP32 also defines hal_init
